name: Deploy Odoo Submodules to Local Addons Folder

on:
  push:
    branches:
      - release-19.0
  pull_request:
    branches:
      - release-19.0
    types: [closed]
  workflow_dispatch:

concurrency:
  group: deploy-odoo-addons-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_BASE_PATH: /home/rbg/odoo/deploy-test
  ADDONS_TARGET: /home/rbg/odoo/deploy-test/addons
  LOG_FILE: /home/rbg/odoo/deploy-test/deploy.log
  TEMP_CLONE_DIR: /tmp/odoo-deploy-${{ github.run_id }}

jobs:
  deploy-to-local:
    runs-on: self-hosted
    timeout-minutes: 15
    
    steps:
      - name: 🧹 Preparar entorno temporal
        run: |
          rm -rf ${{ env.TEMP_CLONE_DIR }}
          mkdir -p ${{ env.TEMP_CLONE_DIR }}
          mkdir -p ${{ env.ADDONS_TARGET }}
          echo "========================================" > ${{ env.LOG_FILE }}
          echo "🚀 Inicio despliegue: $(date)" >> ${{ env.LOG_FILE }}
          echo "Commit: ${{ github.sha }}" >> ${{ env.LOG_FILE }}
          echo "========================================" >> ${{ env.LOG_FILE }}

      - name: 📥 Clonar repositorio con submódulos
        run: |
          cd ${{ env.TEMP_CLONE_DIR }}
          
          echo "Clonando repositorio: https://github.com/${{ github.repository }}.git" >> ${{ env.LOG_FILE }}
          
          git clone --recurse-submodules \
            --branch release-19.0 \
            --depth 1 \
            https://github.com/${{ github.repository }}.git .
          
          if [ $? -ne 0 ]; then
            echo "❌ Error clonando repositorio" | tee -a ${{ env.LOG_FILE }}
            exit 1
          fi
          
          echo "✅ Repositorio clonado correctamente" >> ${{ env.LOG_FILE }}

      - name: 🔄 Sincronizar submódulos a carpeta addons
        run: |
          cd ${{ env.TEMP_CLONE_DIR }}
          
          if [ ! -f .gitmodules ]; then
            echo "⚠️ No hay submódulos para sincronizar" | tee -a ${{ env.LOG_FILE }}
            exit 0
          fi
          
          # CORREGIDO: Extraer las rutas de los submódulos correctamente
          SUBMODULES=$(git config --file .gitmodules --get-regexp path | awk '{print $2}')
          
          if [ -z "$SUBMODULES" ]; then
            echo "⚠️ No se encontraron submódulos" | tee -a ${{ env.LOG_FILE }}
            exit 0
          fi
          
          echo "📦 Submódulos encontrados:" >> ${{ env.LOG_FILE }}
          echo "$SUBMODULES" >> ${{ env.LOG_FILE }}
          
          for SUBMODULE_PATH in $SUBMODULES; do
            SOURCE_PATH="${{ env.TEMP_CLONE_DIR }}/$SUBMODULE_PATH"
            MODULE_NAME=$(basename "$SUBMODULE_PATH")
            TARGET_PATH="${{ env.ADDONS_TARGET }}/$MODULE_NAME"
            
            echo "----------------------------------------" >> ${{ env.LOG_FILE }}
            echo "📦 Procesando: $MODULE_NAME" >> ${{ env.LOG_FILE }}
            echo "   Ruta origen: $SUBMODULE_PATH" >> ${{ env.LOG_FILE }}
            echo "   Destino: $TARGET_PATH" >> ${{ env.LOG_FILE }}
            
            if [ ! -d "$SOURCE_PATH" ]; then
              echo "⚠️ Advertencia: $SUBMODULE_PATH no encontrado, omitiendo" >> ${{ env.LOG_FILE }}
              continue
            fi
            
            # Backup de versión anterior
            if [ -d "$TARGET_PATH" ]; then
              BACKUP_PATH="${TARGET_PATH}.backup.$(date +%s)"
              mv "$TARGET_PATH" "$BACKUP_PATH"
              echo "   📦 Backup creado: $(basename $BACKUP_PATH)" >> ${{ env.LOG_FILE }}
            fi
            
            # Copiar TODO el contenido del submódulo
            rsync -av \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='*.pyc' \
              --exclude='__pycache__' \
              "$SOURCE_PATH/" "$TARGET_PATH/" >> ${{ env.LOG_FILE }} 2>&1
            
            if [ $? -eq 0 ]; then
              echo "   ✅ Sincronizado: $MODULE_NAME" >> ${{ env.LOG_FILE }}
              
              # Contar módulos Odoo dentro
              ODOO_MODULES=$(find "$TARGET_PATH" -maxdepth 2 -name "__manifest__.py" -type f 2>/dev/null | wc -l)
              echo "   📊 Módulos Odoo detectados: $ODOO_MODULES" >> ${{ env.LOG_FILE }}
            else
              echo "   ❌ Error sincronizando $MODULE_NAME" >> ${{ env.LOG_FILE }}
            fi
          done

      - name: 🧹 Limpiar backups antiguos
        run: |
          if [ -d "${{ env.ADDONS_TARGET }}" ]; then
            cd ${{ env.ADDONS_TARGET }}
            for DIR in */; do
              ls -dt ${DIR}.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
            done
            echo "🧹 Limpieza de backups completada" >> ${{ env.LOG_FILE }}
          fi

      - name: 🔐 Establecer permisos
        run: |
          if [ -d "${{ env.ADDONS_TARGET }}" ]; then
            sudo chown -R $USER:$USER ${{ env.ADDONS_TARGET }} 2>/dev/null || true
            find ${{ env.ADDONS_TARGET }} -type d -exec chmod 755 {} \; 2>/dev/null || true
            find ${{ env.ADDONS_TARGET }} -type f -name '*.py' -exec chmod 644 {} \; 2>/dev/null || true
            echo "🔐 Permisos ajustados" >> ${{ env.LOG_FILE }}
          fi
          
      - name: 🔄 Notificar a Odoo
        run: |
          if [ -d "${{ env.ADDONS_TARGET }}" ]; then
            find ${{ env.ADDONS_TARGET }} -name '__init__.py' -exec touch {} \; 2>/dev/null || true
            echo "✅ Archivos __init__.py actualizados" >> ${{ env.LOG_FILE }}
          fi

      - name: 📊 Resumen final
        run: |
          echo "========================================" >> ${{ env.LOG_FILE }}
          echo "✅ Despliegue completado: $(date)" >> ${{ env.LOG_FILE }}
          echo "========================================" >> ${{ env.LOG_FILE }}
          
          if [ -d "${{ env.ADDONS_TARGET }}" ]; then
            echo "" >> ${{ env.LOG_FILE }}
            echo "📁 Contenido de ${{ env.ADDONS_TARGET }}:" >> ${{ env.LOG_FILE }}
            ls -la ${{ env.ADDONS_TARGET }} >> ${{ env.LOG_FILE }}
            
            TOTAL_MODULES=$(find ${{ env.ADDONS_TARGET }} -maxdepth 2 -name "__manifest__.py" -type f 2>/dev/null | wc -l)
            echo "" >> ${{ env.LOG_FILE }}
            echo "📊 Total módulos Odoo: $TOTAL_MODULES" >> ${{ env.LOG_FILE }}
          fi

      - name: 🧹 Limpiar temporales
        run: |
          rm -rf ${{ env.TEMP_CLONE_DIR }}
          echo "🧹 Limpieza completada" >> ${{ env.LOG_FILE }}
      
      - name: 📢 Mostrar en GitHub summary
        if: always()
        run: |
          echo "## 🚀 Despliegue completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Destino:** \`${{ env.ADDONS_TARGET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "${{ env.ADDONS_TARGET }}" ]; then
            echo "### 📁 Módulos desplegados:" >> $GITHUB_STEP_SUMMARY
            ls -d ${{ env.ADDONS_TARGET }}/*/ 2>/dev/null | while read dir; do
              COUNT=$(find "$dir" -maxdepth 2 -name "__manifest__.py" -type f 2>/dev/null | wc -l)
              echo "- **$(basename $dir)** ($COUNT módulos)" >> $GITHUB_STEP_SUMMARY
            done
          fi